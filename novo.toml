[package]
name        = "proptest-core-nv"
version     = "0.0.3"
description = "Generators and shrinking as arithmetic: a strategy is a pure function from a recorded, seeded choice sequence to a value, the combinators compose over that, and shrinking is a walk over the choice sequence that the runner drives. No randomness here — the seed and the PRNG step are both values."
license     = "Apache-2.0"

# An INTERFACE release: every `pub fn` body is a `todo()`, so the
# signatures and the effect rows are published and nothing is
# implemented.  `novo pkg publish` recognises the shape and requires
# both the draft stability and the 0.0.x version; the first
# implementation is the 0.1.0 published over it.
stability   = "draft"

# `core`, and the argument is the whole design.  A `core` package may
# not touch `[rand]`, so the deterministic source is a `u64` seed and a
# splitmix64 step written here — nine lines of integer arithmetic with
# no state outside the `Tape` value.  Randomness enters exactly once,
# in `proptest-nv`, to CHOOSE a seed; everything after that is a
# function of the seed.  That is also what makes a failure reproducible
# from one integer.
layer       = "core"

category    = "testing"

tags        = ["proptest", "property", "quickcheck", "hypothesis", "shrinking", "generator", "fuzz"]
repository  = "https://github.com/novolang/proptest-core-nv"
maintainers = ["novo-lang"]
novo        = ">= 0.8.9"

# A library: no `main`, so `novo pkg build` type-checks and
# effect-checks every module under `src/` and writes no binary.

[docs.pages]
"README.md" = "Generating and shrinking values without randomness"

[dependencies]
# None.  The PRNG is transcribed arithmetic, the shrink passes are
# operations on a list of integers, and a package that needed a
# dependency to halve a number would be the wrong package.
